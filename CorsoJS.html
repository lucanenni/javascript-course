ge.getItem("jsc:progress"),y=v?JSON.parse(v):[];return Array.isArray(y)?y:[]}catch{return[]}}),l=v=>{try{localStorage.setItem("jsc:progress",JSON.stringify(v))}catch{}},s=qd(v=>{r(y=>{if(y.includes(v))return y;let x=[...y,v];return l(x),x})},[]),c=qd(v=>{r(y=>{let x=y.filter(M=>M!==v);return l(x),x})},[]),d=qd(()=>{try{localStorage.removeItem("jsc:progress")}catch{}r([])},[]);return{completed:t,completeChapter:s,uncompleteChapter:c,resetProgress:d}};var _0=$e(vt(),1);var Qt=[{id:0,title:"Cosa significa programmare",short:"Prima di scrivere codice: come ragiona una macchina",blocks:[{type:"h2",id:"dare-istruzioni-a-una-macchina",text:"Dare istruzioni a una macchina"},{type:"p",html:"Un computer non <em>capisce</em> come una persona. Esegue esattamente quello che gli dici, nell'ordine in cui glielo dici, senza interpretare le tue intenzioni. <strong>Programmare significa scrivere una sequenza di istruzioni abbastanza precisa</strong> da poter essere eseguita da una macchina."},{type:"p",html:"Ogni programma lavora su due cose: <strong>dati</strong> (numeri, testi, elenchi) e <strong>istruzioni</strong> che li trasformano. Tutto qui. Le cose complesse nascono dal combinare tante istruzioni semplici."},{type:"callout",variant:"analogy",title:"Come una ricetta",html:"Una ricetta \xE8 un programma: ha una lista di ingredienti (i dati) e passi numerati (le istruzioni). Un umano capisce \xABaggiungi un pizzico di sale\xBB. Una macchina ha bisogno di \xABaggiungi 2 grammi di sale nel contenitore A\xBB. La differenza \xE8 tutta nella precisione."},{type:"h2",id:"cos-e-un-linguaggio-di-programmazione",text:"Cos'\xE8 un linguaggio di programmazione"},{type:"p",html:"Le istruzioni si scrivono in un <strong>linguaggio</strong> con una grammatica (la <em>sintassi</em>) molto rigida: una parentesi o una virgola fuori posto e il programma non parte. Non \xE8 pignoleria inutile \u2014 \xE8 ci\xF2 che permette alla macchina di non avere dubbi su cosa fare."},{type:"p",html:"In questo corso usiamo <strong>JavaScript</strong>, il linguaggio che ogni browser web sa eseguire. \xC8 quello che rende interattive le pagine: pulsanti che reagiscono, contenuti che cambiano, form che si controllano. Il codice viene letto da un \xABmotore\xBB dentro il browser, una riga alla volta, dall'alto verso il basso."},{type:"h2",id:"il-playground-e-gli-errori",text:"Il playground e gli errori"},{type:"p",html:"Sotto quasi ogni spiegazione trovi un <strong>playground</strong>: a sinistra scrivi il codice, a destra vedi il risultato. Il codice viene eseguito da solo mentre scrivi. Il comando <code>console.log(...)</code> serve a stampare un valore nel pannello di destra."},{type:"p",html:"Sbagliare fa parte del lavoro. Quando il motore non capisce qualcosa mostra un <strong>messaggio di errore</strong> in rosso: non \xE8 un rimprovero, \xE8 un indizio su cosa correggere. Saper leggere gli errori \xE8 met\xE0 del mestiere."},{type:"callout",variant:"tip",title:"Non puoi rompere niente",html:"Il tuo codice gira isolato in una sandbox: non pu\xF2 toccare questa pagina, i tuoi file o internet. Se scrivi qualcosa di assurdo, al massimo vedi un errore. Se qualcosa si blocca, viene interrotto dopo 2 secondi. Sperimenta senza paura."},{type:"play",id:"c0-prova",initialCode:`// Le righe che iniziano con // sono commenti: il computer le ignora.
// Servono a te per prendere appunti nel codice.

console.log("Il mio primo programma");
console.log("2 + 2 fa", 2 + 2);

// Ora prova a sbagliare di proposito: scrivi la riga qui sotto
// senza le virgolette e guarda che errore compare a destra.
// console.log(ciao)
`},{type:"p",html:"Quando ti senti a tuo agio con questo meccanismo, segna il capitolo come completato (pulsante in fondo) e prosegui."}]},{id:1,title:"Il tuo primo script",short:"Stampare messaggi con console.log",blocks:[{type:"h2",id:"scrivere-sullo-schermo",text:"Scrivere sullo schermo"},{type:"p",html:"L'istruzione pi\xF9 semplice \xE8 stampare qualcosa. In JavaScript si usa <code>console.log()</code>: tra le parentesi metti i valori da mostrare, separati da virgole."},{type:"p",html:`Qualsiasi testo racchiuso tra virgolette \u2014 doppie <code>"\u2026"</code> o singole <code>'\u2026'</code> \u2014 \xE8 una <strong>stringa</strong> e viene stampato esattamente com'\xE8. Senza virgolette, JavaScript prova a interpretarlo come un comando o un nome, e spesso d\xE0 errore.`},{type:"callout",variant:"tip",title:"Pi\xF9 valori in una volta",html:`<code>console.log("Somma:", 3 + 4)</code> stampa <code>Somma: 7</code>. Puoi mescolare stringhe e calcoli: ogni argomento separato da virgola diventa un pezzo dell'output.`},{type:"h2",id:"un-istruzione-per-riga",text:"Un'istruzione per riga"},{type:"p",html:"Ogni istruzione va idealmente su una riga e si chiude con un punto e virgola <code>;</code>. JavaScript spesso perdona chi lo dimentica, ma prendere l'abitudine ti eviter\xE0 errori strani pi\xF9 avanti."},{type:"h2",id:"prova-tu",text:"Prova tu"},{type:"p",html:"Cambia i testi, aggiungi altre righe di <code>console.log</code>, prova a stampare un calcolo. L'output si aggiorna da solo."},{type:"play",id:"c1-hello",initialCode:`console.log("Ciao, mondo!");
console.log("Sto imparando JavaScript.");

// Aggiungi qui sotto una riga che stampa il tuo nome
// e una che stampa il risultato di 10 * 10
`}]},{id:2,title:"Variabili e tipi di dato",short:"Memorizzare valori con let e const",blocks:[{type:"h2",id:"cosa-sono-le-variabili",text:"Cosa sono le variabili"},{type:"p",html:`Una variabile \xE8 una <strong>scatola con un'etichetta</strong>: l'etichetta \xE8 il nome, dentro c'\xE8 un valore che puoi leggere o cambiare pi\xF9 avanti nel programma. Invece di ripetere <code>"Mario Rossi"</code> ovunque, lo metti una volta in <code>nomeUtente</code> e poi usi quel nome.`},{type:"h2",id:"let-e-const",text:"let e const"},{type:"p",html:"Per creare una variabile usi <code>let</code> o <code>const</code>, segu\xECto dal nome, dal segno <code>=</code> e dal valore iniziale."},{type:"ul",items:["<code>const</code> \u2014 per valori che <strong>non cambieranno mai</strong> (una costante). Se provi a riassegnarli, ottieni un errore.","<code>let</code> \u2014 per valori che <strong>cambieranno</strong> nel tempo (un punteggio, un contatore).","Regola pratica: usa sempre <code>const</code>, e passa a <code>let</code> solo quando ti accorgi che devi riassegnare la variabile."]},{type:"diff",label:"const non si riassegna, let s\xEC",before:`const nome = "Mario";
nome = "Luigi";   // ERRORE: Assignment to constant variable`,after:`let punteggio = 0;
punteggio = 10;   // ok
punteggio = 15;   // ok`},{type:"h2",id:"i-tipi-di-dato-principali",text:"I tipi di dato principali"},{type:"p",html:"Ogni valore ha un <strong>tipo</strong>. All'inizio ti bastano tre tipi:"},{type:"ul",items:[`<strong>string</strong> \u2014 testo tra virgolette: <code>"ciao"</code>, <code>'42 gatti'</code>`,"<strong>number</strong> \u2014 numeri interi o decimali: <code>42</code>, <code>3.14</code>, <code>-7</code>","<strong>boolean</strong> \u2014 solo due valori, <code>true</code> o <code>false</code> (vero / falso)"]},{type:"p",html:'Puoi chiedere il tipo di un valore con <code>typeof</code>: <code>typeof "ciao"</code> restituisce <code>"string"</code>. Esistono anche <code>undefined</code> (una variabile dichiarata senza valore) e <code>null</code> (un \xABvuoto\xBB messo di proposito).'},{type:"callout",variant:"warning",title:"Attenzione al + con le stringhe",html:'Con i numeri <code>+</code> somma: <code>5 + 3</code> fa <code>8</code>. Con le stringhe <code>+</code> <em>concatena</em>: <code>"5" + "3"</code> fa <code>"53"</code>. E <code>"Et\xE0: " + 30</code> fa <code>"Et\xE0: 30"</code> perch\xE9 il numero viene trasformato in testo.'},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"p",html:"Sostituisci i valori con i tuoi dati reali. Servono una costante di testo <code>citta</code> e un numero <code>annoNascita</code>."},{type:"play",id:"c2-es",initialCode:`// Metti la tua citt\xE0 (tra virgolette) e il tuo anno di nascita (numero)
const citta = "";
let annoNascita = 0;

console.log("Vivo a " + citta + ", sono del " + annoNascita);
`,checks:[{label:"Esiste una stringa non vuota chiamata 'citta'",assert:"typeof citta === 'string' && citta.length > 0"},{label:"Esiste un numero chiamato 'annoNascita' diverso da 0",assert:"typeof annoNascita === 'number' && annoNascita !== 0"}],hint:'Le virgolette servono solo per il testo: <code>const citta = "Torino";</code>. Il numero va senza virgolette: <code>let annoNascita = 1998;</code>.'}]},{id:3,title:"Operatori ed espressioni",short:"Calcoli, confronti e valori di verit\xE0",blocks:[{type:"h2",id:"operatori-aritmetici",text:"Operatori aritmetici"},{type:"p",html:"Con i numeri usi <code>+</code> (somma), <code>-</code> (sottrazione), <code>*</code> (moltiplicazione), <code>/</code> (divisione) e <code>%</code> (<em>modulo</em>: il resto della divisione, utile per capire se un numero \xE8 pari)."},{type:"p",html:"Un'<strong>espressione</strong> \xE8 qualsiasi pezzo di codice che produce un valore: <code>3 * (2 + 1)</code> \xE8 un'espressione che vale <code>9</code>. Le parentesi decidono l'ordine, come in matematica."},{type:"h2",id:"operatori-di-confronto",text:"Operatori di confronto"},{type:"p",html:"Servono a confrontare due valori e producono sempre un <strong>boolean</strong>:"},{type:"ul",items:["<code>===</code> uguale a  \xB7  <code>!==</code> diverso da","<code>&gt;</code> maggiore  \xB7  <code>&lt;</code> minore  \xB7  <code>&gt;=</code> maggiore o uguale  \xB7  <code>&lt;=</code> minore o uguale"]},{type:"callout",variant:"warning",title:"Tre uguali, non uno",html:"<code>=</code> significa \xABassegna\xBB (metti un valore nella variabile). <code>===</code> significa \xAB\xE8 uguale a?\xBB. Confondere i due \xE8 l'errore numero uno dei principianti. Esiste anche <code>==</code>, ma usa sempre <code>===</code>: \xE8 pi\xF9 prevedibile."},{type:"h2",id:"operatori-logici",text:"Operatori logici"},{type:"p",html:"Combinano pi\xF9 condizioni booleane:"},{type:"ul",items:["<code>&amp;&amp;</code> (AND) \u2014 vero solo se <strong>entrambe</strong> le condizioni sono vere","<code>||</code> (OR) \u2014 vero se <strong>almeno una</strong> \xE8 vera","<code>!</code> (NOT) \u2014 inverte: <code>!true</code> \xE8 <code>false</code>"]},{type:"diff",label:"Espressioni che producono un booleano",before:`let eta = 20;
eta >= 18            // true
eta === 18           // false
eta % 2 === 0        // true  (20 \xE8 pari)`,after:`let eta = 20;
let haBiglietto = true;
eta >= 18 && haBiglietto   // true
eta < 18 || haBiglietto    // true
!haBiglietto               // false`},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"p",html:"Calcola l'area di un rettangolo e stabilisci se \xE8 \xABgrande\xBB."},{type:"play",id:"c3-es",initialCode:`const base = 8;
const altezza = 5;

// 1. Calcola l'area (base per altezza)
const area = 0;

// 2. true se l'area \xE8 maggiore di 30, altrimenti false
const grande = false;

console.log("Area:", area, "- Grande?", grande);
`,checks:[{label:"'area' vale 40",assert:"area === 40"},{label:"'grande' \xE8 true (40 > 30)",assert:"grande === true"}],hint:"Per l'area: <code>const area = base * altezza;</code>. Per il confronto puoi scrivere direttamente <code>const grande = area &gt; 30;</code> \u2014 il risultato \xE8 gi\xE0 un booleano."}]},{id:4,title:"Prendere decisioni",short:"Eseguire codice diverso con if / else",blocks:[{type:"h2",id:"la-logica-condizionale",text:"La logica condizionale"},{type:"p",html:"\xABSe piove prendo l'ombrello, altrimenti esco in maglietta.\xBB Un programma deve poter scegliere strade diverse in base ai dati. Lo strumento \xE8 l'istruzione <code>if</code>."},{type:"h2",id:"la-sintassi-di-if-else",text:"La sintassi di if / else"},{type:"p",html:"Scrivi <code>if</code>, poi una <strong>condizione</strong> tra parentesi tonde, poi un blocco di codice tra parentesi graffe <code>{ }</code>. Il blocco viene eseguito <strong>solo se</strong> la condizione \xE8 <code>true</code>. Con <code>else</code> indichi cosa fare altrimenti, e con <code>else if</code> aggiungi altri casi."},{type:"diff",label:"Da if semplice a catena if / else if / else",before:`let ora = 14;

if (ora < 12) {
  console.log("Buongiorno");
}`,after:`let voto = 7;

if (voto >= 8) {
  console.log("Ottimo");
} else if (voto >= 6) {
  console.log("Sufficiente");
} else {
  console.log("Insufficiente");
}`},{type:"callout",variant:"tip",title:"La condizione \xE8 un booleano",html:"Tra le parentesi di <code>if</code> ci va qualcosa che vale <code>true</code> o <code>false</code>: un confronto (<code>eta &gt;= 18</code>), una variabile booleana, o una combinazione con <code>&amp;&amp;</code> / <code>||</code>."},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"p",html:`In base al valore di <code>voto</code>, assegna alla variabile <code>giudizio</code> la stringa giusta: <code>"ottimo"</code> (8\u201310), <code>"sufficiente"</code> (6\u20137) oppure <code>"insufficiente"</code> (sotto il 6). Prova poi a cambiare <code>voto</code> e verifica che l'output segua.`},{type:"play",id:"c4-es",initialCode:`let voto = 9;
let giudizio = "";

// Scrivi qui la catena if / else if / else che assegna 'giudizio'


console.log("Voto", voto, "->", giudizio);
`,checks:[{label:"'giudizio' \xE8 una stringa non vuota",assert:"typeof giudizio === 'string' && giudizio.length > 0"},{label:`Con voto 9, 'giudizio' vale "ottimo"`,assert:"giudizio === 'ottimo'"}],hint:'<code>if (voto &gt;= 8) { giudizio = "ottimo"; } else if (voto &gt;= 6) { giudizio = "sufficiente"; } else { giudizio = "insufficiente"; }</code>'}]},{id:5,title:"Le liste: array",short:"Collezioni ordinate di valori",blocks:[{type:"h2",id:"cos-e-un-array",text:"Cos'\xE8 un array"},{type:"p",html:"Un <strong>array</strong> \xE8 una lista ordinata di valori, racchiusa tra parentesi quadre <code>[ ]</code> con gli elementi separati da virgole. Serve quando hai \xABtante cose dello stesso tipo\xBB: una lista della spesa, i voti di un esame, i nomi degli iscritti."},{type:"p",html:"Ogni elemento ha una <strong>posizione</strong> (l'<em>indice</em>) che parte da <code>0</code>, non da 1. <code>spesa[0]</code> \xE8 il primo elemento, <code>spesa[1]</code> il secondo."},{type:"diff",label:"Leggere e contare gli elementi",before:`const spesa = ["pane", "latte", "uova"];

console.log(spesa[0]);       // "pane"
console.log(spesa[2]);       // "uova"
console.log(spesa.length);   // 3  (quanti elementi)`,after:`const spesa = ["pane", "latte", "uova"];
const ultimo = spesa[spesa.length - 1];

console.log(ultimo);         // "uova"`},{type:"h2",id:"aggiungere-e-togliere",text:"Aggiungere e togliere"},{type:"ul",items:['<code>spesa.push("mele")</code> \u2014 aggiunge in fondo',"<code>spesa.pop()</code> \u2014 rimuove l'ultimo e lo restituisce",`<code>spesa.includes("latte")</code> \u2014 <code>true</code> se l'elemento c'\xE8`,'<code>spesa.indexOf("uova")</code> \u2014 la posizione di un elemento (o <code>-1</code>)']},{type:"callout",variant:"info",title:"const e array",html:"Puoi modificare il contenuto di un array anche se \xE8 dichiarato con <code>const</code>: <code>push</code> e <code>pop</code> funzionano. Quello che <code>const</code> vieta \xE8 riassegnare l'intera variabile a un altro array."},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"play",id:"c5-es",initialCode:`// 1. Crea 'spesa' con almeno 3 prodotti (stringhe)
const spesa = [];

// 2. Aggiungi "pane" in fondo all'array


// 3. Salva in 'totale' quanti prodotti ci sono adesso
const totale = 0;

console.log(spesa, "->", totale, "prodotti");
`,checks:[{label:"'spesa' \xE8 un array con almeno 4 elementi",assert:"Array.isArray(spesa) && spesa.length >= 4"},{label:`'spesa' contiene "pane"`,assert:"spesa.includes('pane')"},{label:"'totale' \xE8 uguale al numero di elementi",assert:"totale === spesa.length"}],hint:'Parti da <code>const spesa = ["latte", "uova", "mele"];</code>, poi <code>spesa.push("pane");</code>, poi <code>const totale = spesa.length;</code>.'}]},{id:6,title:"Ripetere: i cicli",short:"for e while per fare la stessa cosa pi\xF9 volte",blocks:[{type:"h2",id:"perche-servono-i-cicli",text:"Perch\xE9 servono i cicli"},{type:"p",html:"Se devi stampare i numeri da 1 a 100 non scrivi 100 righe: usi un <strong>ciclo</strong>, che ripete un blocco di codice finch\xE9 una condizione resta vera."},{type:"h2",id:"il-ciclo-for",text:"Il ciclo for"},{type:"p",html:"Il <code>for</code> ha tre parti tra parentesi, separate da punto e virgola:"},{type:"ol",items:["<strong>inizializzazione</strong>: <code>let i = 0</code> \u2014 crea un contatore","<strong>condizione</strong>: <code>i &lt; 5</code> \u2014 si ripete finch\xE9 \xE8 vera","<strong>aggiornamento</strong>: <code>i++</code> \u2014 aumenta il contatore di 1 a ogni giro"]},{type:"diff",label:"for e accumulatore",before:`for (let i = 1; i <= 5; i++) {
  console.log("giro numero", i);
}
// stampa 1, 2, 3, 4, 5`,after:`let somma = 0;

for (let i = 1; i <= 5; i++) {
  somma = somma + i;   // oppure: somma += i
}

console.log(somma);   // 15`},{type:"h2",id:"while-break-e-continue",text:"while, break e continue"},{type:"p",html:"<code>while (condizione) { \u2026 }</code> ripete finch\xE9 la condizione \xE8 vera \u2014 utile quando non sai in anticipo quanti giri servono. Dentro un ciclo, <code>break</code> lo interrompe subito e <code>continue</code> salta al giro successivo."},{type:"callout",variant:"warning",title:"Il ciclo infinito",html:"Se la condizione non diventa mai falsa (per esempio dimentichi <code>i++</code>), il ciclo gira per sempre e blocca il programma. Qui viene interrotto dopo 2 secondi con un avviso, ma nel browser vero congela la pagina. Controlla sempre che il contatore avanzi verso la fine."},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"play",id:"c6-es1",initialCode:`// Somma tutti i numeri da 1 a 100 usando un ciclo for
let somma = 0;

for (let i = 1; i <= 100; i++) {
  // aggiungi 'i' a 'somma'
}

console.log("Somma 1..100 =", somma);
`,checks:[{label:"'somma' vale 5050",assert:"somma === 5050"}],hint:"Dentro il ciclo: <code>somma += i;</code>"},{type:"p",html:"Adesso combina ciclo e array: conta quanti numeri della lista superano una certa soglia."},{type:"play",id:"c6-es2",initialCode:`const numeri = [4, 9, 15, 6, 2, 11, 8];
let quantiGrandi = 0;

// Scorri l'array con un for e conta quanti elementi sono > 7
for (let i = 0; i < numeri.length; i++) {

}

console.log(quantiGrandi, "numeri maggiori di 7");
`,checks:[{label:"'quantiGrandi' vale 4",assert:"quantiGrandi === 4"}],hint:"Dentro il ciclo: <code>if (numeri[i] &gt; 7) { quantiGrandi++; }</code>. I numeri &gt; 7 sono 9, 15, 11, 8."}]},{id:7,title:"Gli oggetti",short:"Raggruppare dati con nome",blocks:[{type:"h2",id:"cos-e-un-oggetto",text:"Cos'\xE8 un oggetto"},{type:"p",html:"Un array mette in fila valori dello stesso genere. Un <strong>oggetto</strong> invece raggruppa informazioni <em>diverse</em> che descrivono una stessa cosa, ognuna con un nome (la <em>propriet\xE0</em> o <em>chiave</em>)."},{type:"p",html:"Si scrive tra parentesi graffe <code>{ }</code>, con coppie <code>chiave: valore</code> separate da virgole:"},{type:"diff",label:"Creare e leggere un oggetto",before:`const persona = {
  nome: "Ada",
  eta: 36,
  attiva: true
};

console.log(persona.nome);   // "Ada"
console.log(persona.eta);    // 36`,after:`const persona = { nome: "Ada", eta: 36 };

// modificare una propriet\xE0
persona.eta = 37;

// aggiungerne una nuova
persona.citta = "Londra";

console.log(persona);`},{type:"h2",id:"notazione-con-il-punto",text:"Notazione con il punto"},{type:"p",html:"Per leggere o scrivere una propriet\xE0 usi <code>oggetto.chiave</code>. Gli oggetti possono contenere array, altri oggetti, o stare dentro un array \u2014 \xE8 cos\xEC che si rappresentano i dati veri: <code>utenti</code> \xE8 un array di oggetti, ognuno con <code>nome</code> e <code>email</code>."},{type:"callout",variant:"tip",title:"Array + oggetti = quasi tutto",html:"La maggior parte dei dati che incontrerai (risposte di un server, righe di un database) sono array di oggetti. Saperli scorrere con un ciclo e leggere le propriet\xE0 \xE8 una delle abilit\xE0 pi\xF9 usate."},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"play",id:"c7-es1",initialCode:`const libro = {
  titolo: "",
  autore: "",
  anno: 0
};

// 1. Compila titolo e autore con un libro che conosci
// 2. Cambia 'anno' a 2020 usando la notazione con il punto
// 3. Componi in 'scheda' la frase:  "<titolo> di <autore>"
const scheda = "";

console.log(libro);
console.log(scheda);
`,checks:[{label:"'libro' ha titolo e autore non vuoti",assert:"libro.titolo.length > 0 && libro.autore.length > 0"},{label:"'libro.anno' vale 2020",assert:"libro.anno === 2020"},{label:"'scheda' contiene titolo e autore",assert:"scheda.includes(libro.titolo) && scheda.includes(libro.autore)"}],hint:'<code>libro.anno = 2020;</code> e poi <code>const scheda = libro.titolo + " di " + libro.autore;</code>'},{type:"p",html:"Ora un array di oggetti: estrai i nomi di chi \xE8 promosso."},{type:"play",id:"c7-es2",initialCode:`const studenti = [
  { nome: "Anna",  voto: 8 },
  { nome: "Berto", voto: 5 },
  { nome: "Carla", voto: 6 },
  { nome: "Dino",  voto: 4 }
];

// Riempi 'promossi' con i NOMI di chi ha voto >= 6
const promossi = [];

for (let i = 0; i < studenti.length; i++) {

}

console.log(promossi);
`,checks:[{label:`'promossi' \xE8 esattamente ["Anna", "Carla"]`,assert:"JSON.stringify(promossi) === JSON.stringify(['Anna','Carla'])"}],hint:"Dentro il ciclo: <code>if (studenti[i].voto &gt;= 6) { promossi.push(studenti[i].nome); }</code>"}]},{id:8,title:"Le funzioni",short:"Impacchettare codice riutilizzabile",blocks:[{type:"h2",id:"cos-e-una-funzione",text:"Cos'\xE8 una funzione"},{type:"p",html:"Una funzione \xE8 un blocco di codice con un nome, che puoi <strong>richiamare</strong> tutte le volte che vuoi. Come un frullatore: metti dentro gli ingredienti (gli <em>argomenti</em>), lui fa il suo lavoro e ti restituisce un risultato."},{type:"p",html:"La definisci con <code>function</code>, un nome, delle parentesi tonde e un blocco <code>{ }</code>. La <strong>chiami</strong> scrivendo il suo nome segu\xECto da parentesi."},{type:"h2",id:"parametri-e-return",text:"Parametri e return"},{type:"p",html:"Tra le parentesi della definizione metti i <strong>parametri</strong>: nomi per i valori che ricever\xE0. Con <code>return</code> la funzione <strong>restituisce</strong> un valore a chi l'ha chiamata; dopo <code>return</code> la funzione termina."},{type:"diff",label:"Funzione che stampa vs funzione che restituisce",before:`function saluta(nome) {
  console.log("Ciao " + nome);
}

saluta("Marco");   // stampa, ma non "vale" niente`,after:`function somma(a, b) {
  return a + b;
}

const totale = somma(5, 10);
console.log(totale);   // 15`},{type:"h2",id:"arrow-function",text:"Arrow function"},{type:"p",html:"C'\xE8 una scrittura pi\xF9 breve, le <em>arrow function</em>, molto comune nel codice moderno:"},{type:"diff",label:"Stessa funzione, due sintassi",before:`function doppio(n) {
  return n * 2;
}`,after:`const doppio = (n) => {
  return n * 2;
};

function moltiplica(a, b) {

}

console.log(moltiplica(6, 7));   // deve stampare 42
console.log(moltiplica(3, 0));   // deve stampare 0
`,checks:[{label:"moltiplica(6, 7) restituisce 42",assert:"moltiplica(6, 7) === 42"},{label:"moltiplica(3, 0) restituisce 0",assert:"moltiplica(3, 0) === 0"}],hint:"Dentro le graffe: <code>return a * b;</code>. Ricorda che serve <code>return</code>, non <code>console.log</code>."},{type:"play",id:"c8-es2",initialCode:`// Scrivi un'arrow function saluta(nome)
// che restituisce la stringa:  "Ciao, <nome>!"
const saluta = (nome) => {

};

console.log(saluta("Sara"));   // "Ciao, Sara!"
`,checks:[{label:'saluta("Sara") restituisce "Ciao, Sara!"',assert:"saluta('Sara') === 'Ciao, Sara!'"},{label:'saluta("Lin") restituisce "Ciao, Lin!"',assert:"saluta('Lin') === 'Ciao, Lin!'"}],hint:'<code>return "Ciao, " + nome + "!";</code>'}]},{id:9,title:"Modificare la pagina: il DOM",short:"Far reagire l'HTML al tuo codice",blocks:[{type:"h2",id:"cos-e-il-dom",text:"Cos'\xE8 il DOM"},{type:"p",html:"Fin qui abbiamo solo stampato nella console. Ma il vero motivo per cui JavaScript esiste \xE8 <strong>cambiare la pagina web</strong>. Il browser trasforma l'HTML in una struttura di oggetti chiamata <strong>DOM</strong> (Document Object Model), e JavaScript pu\xF2 leggerla e modificarla."},{type:"p",html:"Il punto d'ingresso \xE8 <code>document</code>. In questo playground la \xABpagina\xBB \xE8 il riquadro in alto a destra: contiene un titolo, un pulsante e un paragrafo vuoto."},{type:"h2",id:"selezionare-e-modificare-elementi",text:"Selezionare e modificare elementi"},{type:"ul",items:[`<code>document.getElementById("titolo")</code> \u2014 prende l'elemento con quell'<code>id</code>`,'<code>document.querySelector(".classe")</code> \u2014 prende il primo elemento che corrisponde a un selettore CSS','<code>elemento.textContent = "nuovo testo"</code> \u2014 cambia il testo','<code>elemento.style.color = "red"</code> \u2014 cambia uno stile']},{type:"callout",variant:"warning",title:"textContent, non innerHTML",html:"Per inserire testo usa <code>textContent</code>. <code>innerHTML</code> interpreta il contenuto come HTML: se ci finisce dentro testo scritto da un utente, \xE8 una porta aperta per attacchi. Da principiante, attieniti a <code>textContent</code>."},{type:"h2",id:"reagire-ai-clic",text:"Reagire ai clic"},{type:"p",html:'Con <code>elemento.addEventListener("click", funzione)</code> dici al browser: \xABquando qualcuno clicca questo elemento, esegui questa funzione\xBB. \xC8 cos\xEC che una pagina diventa interattiva.'},{type:"diff",label:"Cambiare testo e gestire un clic",before:`const titolo = document.getElementById("titolo");
titolo.textContent = "Testo cambiato da JS";`,after:`const btn = document.getElementById("btn");

  document.getElementById("out").textContent = "Hai cliccato!";
});`},{type:"h2",id:"esercizio",text:"Esercizio"},{type:"p",html:"Modifica la pagina qui sopra: cambia il titolo e fai reagire il pulsante. Dopo aver scritto il codice, prova a cliccare davvero il pulsante nel riquadro."},{type:"play",id:"c9-es",mode:"dom",initialCode:`// 1. Cambia il testo di #titolo in "Benvenuto"
